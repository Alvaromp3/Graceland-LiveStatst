<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graceland Soccer Live Stats 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        color: #f4eee4;
        background:
          radial-gradient(ellipse 80% 55% at 50% 42%, rgba(201, 162, 79, 0.16), transparent 58%),
          radial-gradient(ellipse 50% 40% at 80% 90%, rgba(90, 70, 30, 0.18), transparent 60%),
          linear-gradient(180deg, #16130f 0%, #0b0a08 55%, #070605 100%);
      }

      h1 {
        padding: 0 24px;
        text-align: center;
        font-family: "Bodoni Moda", serif;
        font-size: clamp(56px, 10vw, 128px);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.03em;
      }

      h1 span {
        display: block;
        margin-top: 10px;
        font-style: italic;
        color: #d4b36a;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>
      Welcome to
      <span>Graceland Live Stats</span>
    </h1>
  </body>
</html>
